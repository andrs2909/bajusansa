<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NYEMILJAJAN">
<meta name="theme-color" content="#10B981">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NYEMILJAJAN POS</title>
<style>
:root{--pr:#10B981;--prd:#059669;--bg:#F8FAFC;--tx:#172033;--mut:#64748B;--bd:#E2E8F0;--or:#F59E0B;--rd:#DC2626;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(130px + env(safe-area-inset-bottom,0px))}
h2{margin:6px 0 10px;font-size:20px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;background:#fff;margin-bottom:8px}
button{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:12px 14px;min-height:46px}
.pri{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}
.dng{color:var(--rd)}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 6px rgba(15,23,42,.07);margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.f1{flex:1}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.chip{white-space:nowrap;border-radius:20px;padding:8px 14px;min-height:0}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px;border-radius:16px}
.prod .p{color:var(--prd);font-weight:700;margin-top:auto}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;padding:8px 2px;color:var(--mut);display:flex;flex-direction:column;gap:2px;align-items:center}
.nav button.on{color:var(--prd);font-weight:700}.nav b{font-size:20px;line-height:1}
.bar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:9}
.bar button{width:100%;box-shadow:0 4px 14px rgba(5,150,105,.35)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:#D1FAE5;color:var(--prd);font-weight:600}
.pill.o{background:#FEF3C7;color:#B45309}.pill.r{background:#FEE2E2;color:var(--rd)}
.line{padding:8px 0;border-bottom:1px solid var(--bd)}
.q button{min-height:36px;padding:4px 14px}
.warn{background:#FEF3C7;color:#92400E;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}
.inv{background:#fff;border-radius:14px;padding:14px}.inv table{width:100%;border-collapse:collapse}.inv td{padding:4px 0;vertical-align:top}.inv td:last-child{text-align:right;white-space:nowrap}
.inv img{display:block;width:190px;max-width:100%;margin:8px auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--tx);color:#fff;padding:10px 16px;border-radius:20px;z-index:50}
@media print{body{padding:0;background:#fff}body>*:not(.ov){display:none!important}.ov{position:static;background:none}.sheet{max-height:none;padding:0;background:#fff}.np{display:none!important}}
</style>
</head>
<body>
<div id="v"></div>
<div id="bar" class="bar"></div>
<nav class="nav" id="nav"></nav>
<div id="sh"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID'),p2=n=>String(n).padStart(2,'0');
const fd=d=>{d=new Date(d);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const CATS=['Jastip','Frozen Food','Snack','Lainnya'];
const STORES=['products','customers','transactions','payments','movements','settings','recipes'];
let db,P=[],C=[],T=[],Pay=[],M=[],RC=[],ST={id:'main',name:'NYEMILJAJAN',address:'',wa:'',footer:'Terima kasih sudah belanja!',ship:0,howto:'Scan QRIS lalu kirim bukti bayar.',qris:'',lastBackup:0,pin:''};
let icust='',itab='belum',tab='kasir',cat='Semua',q='',cart=[];
const NAV=[['home','📊','Beranda'],['kasir','🛒','Kasir'],['produk','📦','Produk'],['invoice','🧾','Invoice'],['more','☰','Lainnya']];

function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('nyemiljajan',2);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
const getAll=s=>new Promise((ok,no)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function putMany(list,dels=[]){return new Promise((ok,no)=>{const names=[...new Set([...list,...dels].map(x=>x[0]))],t=db.transaction(names,'readwrite');list.forEach(([s,o])=>t.objectStore(s).put(o));dels.forEach(([s,id])=>t.objectStore(s).delete(id));t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
const rec=o=>({id:crypto.randomUUID(),store_id:'main',created_at:Date.now(),updated_at:Date.now(),...o});
const mv=(pid,qty,note)=>{const m=rec({product_id:pid,qty,note,date:new Date().toISOString()});M.push(m);return ['movements',m]};
const paid=t=>Pay.filter(p=>p.tx_id===t.id).reduce((a,p)=>a+p.amount,0);
const status=t=>{if(t.void)return 'Batal';const s=t.total-paid(t);return s<=0?'Lunas':paid(t)>0?'Sebagian':'Belum bayar'};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function save(list,dels){try{await putMany(list,dels||[])}catch(e){toast('Gagal menyimpan, coba lagi');throw e}}

async function init(){
  await openDB();
  [P,C,T,Pay,M,RC]=await Promise.all(['products','customers','transactions','payments','movements','recipes'].map(getAll));
  T.sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);const s=await getAll('settings');if(s[0])Object.assign(ST,s[0]);
  if(!P.length){P=[['Cireng Isi Ayam Pedas','Frozen Food',7000,12000,50,'pcs',1],['Bakso Malang Frozen','Frozen Food',17000,25000,30,'pack',1],['Jastip Skincare (contoh)','Jastip',70000,85000,0,'pcs',0]].map(([name,category,cost,price,stock,unit,track])=>rec({sku:'',name,category,cost,price,stock,unit,track,active:true}));await save(P.map(x=>['products',x]))}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Versi baru terpasang, buka ulang aplikasi')})}
  render();lock();let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(ST.pin&&Date.now()-hid>60000)lock()})
}
function render(){
  $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${tab===k||(k==='more'&&['pelanggan','resep','stok','set'].includes(tab))?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('');
  $('#bar').innerHTML='';
  const old=!ST.lastBackup||Date.now()-ST.lastBackup>7*864e5;
  const warn=(T.length&&old)?`<div class="warn">⚠️ Data hanya tersimpan di HP ini. Segera buat backup di menu Atur.</div>`:'';
  $('#v').innerHTML=warn+'<div id="c"></div>';({home:vHome,more:vMore,resep:vResep,stok:vStok,kasir:vKasir,produk:vProduk,pelanggan:vPel,invoice:vInv,set:vSet})[tab]();
}
function go(t){tab=t;render()}
function sheet(h){$('#sh').innerHTML=`<div class="ov" onclick="if(event.target===this)closeS()"><div class="sheet">${h}</div></div>`}
function closeS(){$('#sh').innerHTML=''}

/* KASIR */
function vKasir(){
  $('#c').innerHTML=`<input id="q" placeholder="🔍 Cari produk" value="${esc(q)}"><div class="chips">${['Semua',...CATS].map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid" id="g"></div>`;
  $('#q').oninput=e=>{q=e.target.value;drawG()};drawG();drawBar();
}
function drawG(){
  const l=P.filter(p=>p.active&&(cat==='Semua'||p.category===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));
  $('#g').innerHTML=l.map(p=>`<button class="card prod" onclick="add('${p.id}')"><span>${esc(p.name)}</span><span class="mut">${esc(p.category)}${p.track?' · stok '+p.stock:''}</span><span class="p">${rp(p.price)}</span></button>`).join('')+`<button class="card prod" onclick="freeItem()"><span>➕ Item bebas</span><span class="mut">harga jastip custom</span></button>`;
}
function drawBar(){const n=cart.reduce((a,c)=>a+c.qty,0);$('#bar').innerHTML=n?`<button class="pri" onclick="cartSheet()">Keranjang (${n}) · ${rp(cart.reduce((a,c)=>a+c.qty*c.price,0))}</button>`:''}
function add(id){const p=P.find(x=>x.id===id),e=cart.find(c=>c.pid===id);if(p.track&&((e?e.qty:0)+1)>p.stock)return toast('Stok '+p.name+' tidak cukup');e?e.qty++:cart.push({pid:id,name:p.name,category:p.category,price:p.price,cost:p.cost,qty:1});drawBar()}
function freeItem(){const n=prompt('Nama barang jastip:');if(!n)return;const pr=parseFloat(prompt('Harga jual (Rp):'));if(!(pr>=0))return toast('Harga tidak valid');const hp=parseFloat(prompt('Modal/HPP (Rp), boleh kosong:'))||0;cart.push({pid:null,name:n,category:'Jastip',price:pr,cost:hp,qty:1});drawBar()}
function cartSheet(){
  const lines=cart.map((c,i)=>`<div class="line row sp"><div class="f1"><b>${esc(c.name)}</b><div class="mut">${rp(c.price)}</div></div><div class="row q"><button onclick="qty(${i},-1)">−</button><b>${c.qty}</b><button onclick="qty(${i},1)">+</button></div></div>`).join('');
  sheet(`<h2>Keranjang</h2><div class="card">${lines||'<p class="mut">Kosong</p>'}</div>
  <select id="cs" onchange="$('#nc').style.display=this.value==='new'?'block':'none'"><option value="">Pelanggan umum</option>${C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="new">+ Pelanggan baru</option></select>
  <div id="nc" style="display:none"><input id="nn" placeholder="Nama pelanggan"><input id="nw" inputmode="tel" placeholder="No. WhatsApp (08...)"></div>
  <div class="row"><input id="di" type="number" inputmode="numeric" placeholder="Diskon Rp" oninput="calc()"><input id="sh2" type="number" inputmode="numeric" placeholder="Ongkir Rp" value="${ST.ship||''}" oninput="calc()"></div>
  <select id="stt" onchange="$('#pa').style.display=this.value==='part'?'block':'none'"><option value="unpaid">Belum bayar</option><option value="paid">Lunas</option><option value="part">Bayar sebagian</option></select>
  <input id="pa" type="number" inputmode="numeric" placeholder="Jumlah dibayar Rp" style="display:none">
  <select id="mt"><option>QRIS</option><option>Tunai</option><option>Transfer</option></select>
  <div class="row sp card"><span>Total</span><b id="tot" style="font-size:22px"></b></div>
  <div class="row"><button onclick="closeS()">Tutup</button><button class="dng" onclick="cart=[];closeS();drawBar()">Kosongkan</button><button class="pri f1" onclick="checkout()">Checkout</button></div>`);calc()
}
function qty(i,d){const pp=cart[i].pid&&P.find(x=>x.id===cart[i].pid);if(d>0&&pp&&pp.track&&cart[i].qty+d>pp.stock)return toast('Stok tidak cukup');cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);drawBar();cart.length?cartSheet():closeS()}
function calc(){const sub=cart.reduce((a,c)=>a+c.qty*c.price,0),d=+$('#di').value||0,s=+$('#sh2').value||0,t=Math.max(0,sub-d+s);$('#tot').textContent=rp(t);return{sub,d,s,t}}
async function checkout(){
  if(!cart.length)return;const f=calc(),now=new Date();let cid=$('#cs').value;const list=[];
  if(cid==='new'){const n=$('#nn').value.trim();if(n){const c=rec({name:n,wa:$('#nw').value.trim(),address:''});C.push(c);list.push(['customers',c]);cid=c.id}else cid=''}
  const ymd=now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate()),pre='INV-'+ymd+'-';let n=T.filter(t=>t.no.startsWith(pre)).length+1;while(T.some(t=>t.no===pre+String(n).padStart(3,'0')))n++;
  const t=rec({no:pre+String(n).padStart(3,'0'),date:now.toISOString(),customer_id:cid||null,items:cart.map(c=>({...c})),subtotal:f.sub,discount:f.d,shipping:f.s,total:f.t});list.push(['transactions',t]);
  const s=$('#stt').value,amt=s==='paid'?f.t:s==='part'?Math.min(+$('#pa').value||0,f.t):0;let pay=null;
  if(amt>0){pay=rec({tx_id:t.id,date:now.toISOString(),amount:amt,method:$('#mt').value});list.push(['payments',pay])}
  cart.forEach(c=>{const p=c.pid&&P.find(x=>x.id===c.pid);if(p&&p.track){p.stock=(+p.stock||0)-c.qty;p.updated_at=Date.now();list.push(['products',p]);list.push(mv(p.id,-c.qty,t.no))}});
  await save(list);T.unshift(t);if(pay)Pay.push(pay);cart=[];closeS();render();invSheet(t.id);toast('Transaksi tersimpan')
}

/* INVOICE */
function invText(t){const c=C.find(x=>x.id===t.customer_id),pd=paid(t);return `*${ST.name}*\n${t.no} · ${fd(t.date)}\n${c?'Kepada: '+c.name+'\n':''}\n`+t.items.map(i=>`${i.name}\n  ${i.qty} x ${rp(i.price)} = ${rp(i.qty*i.price)}`).join('\n')+(t.discount?`\nDiskon: -${rp(t.discount)}`:'')+(t.shipping?`\nOngkir: ${rp(t.shipping)}`:'')+`\n\n*TOTAL: ${rp(t.total)}*\nDibayar: ${rp(pd)}\nSisa: ${rp(t.total-pd)}\n\n${ST.howto}\n${ST.footer}`}
function waNum(n){n=(n||'').replace(/\D/g,'');return n.startsWith('0')?'62'+n.slice(1):n}
function invSheet(id){
  const t=T.find(x=>x.id===id),c=C.find(x=>x.id===t.customer_id),pd=paid(t),sisa=t.total-pd,s=status(t);
  sheet(`<div class="inv"><div style="text-align:center"><b style="font-size:20px;color:var(--prd)">${esc(ST.name)}</b><div class="mut">${esc(ST.address)}</div></div><hr>
  <div class="row sp"><b>${t.no}</b><span class="mut">${fd(t.date)}</span></div>${c?`<div>Kepada: <b>${esc(c.name)}</b></div>`:''}<hr>
  <table>${t.items.map(i=>`<tr><td>${esc(i.name)}<div class="mut">${i.qty} x ${rp(i.price)}</div></td><td>${rp(i.qty*i.price)}</td></tr>`).join('')}
  ${t.discount?`<tr><td>Diskon</td><td>-${rp(t.discount)}</td></tr>`:''}${t.shipping?`<tr><td>Ongkir</td><td>${rp(t.shipping)}</td></tr>`:''}
  <tr><td><b>TOTAL</b></td><td><b>${rp(t.total)}</b></td></tr><tr><td>Dibayar</td><td>${rp(pd)}</td></tr>${Pay.filter(p=>p.tx_id===id).map(p=>`<tr><td class="mut">• ${fd(p.date)} ${esc(p.method)}</td><td class="mut">${rp(p.amount)}</td></tr>`).join('')}<tr><td><b>Sisa</b></td><td><b>${rp(sisa)}</b></td></tr></table>
  <p><span class="pill ${s==='Lunas'?'':s==='Sebagian'?'o':'r'}">${s}</span></p>
  ${sisa<=0&&!t.void?'<div class="mut" style="text-align:center">Lunas, jadi QRIS tidak ditampilkan.</div>':''}${sisa>0&&ST.qris?`<img src="${ST.qris}" alt="QRIS"><div class="mut" style="text-align:center">${esc(ST.howto)}</div>`:''}<p class="mut" style="text-align:center">${esc(ST.footer)}</p></div>
  <div class="np"><div class="row" style="margin-top:10px"><button class="pri f1" onclick="sendF('${id}','png')">📷 Gambar + teks</button><button class="pri f1" onclick="sendF('${id}','pdf')">📄 PDF + teks</button></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="f1" onclick="waText('${id}')">WA teks</button>${sisa>0&&!t.void?`<button class="f1" onclick="payMore('${id}')">Catat bayar</button><button class="f1" onclick="remind('${id}')">🔔 Ingatkan</button>`:''}<button class="f1" onclick="dupInv('${id}')">Duplikat</button></div>
  <div class="row" style="margin-top:8px">${t.void?'':`<button class="dng f1" onclick="voidInv('${id}')">Batalkan</button>`}<button class="f1" onclick="closeS()">Tutup</button></div></div>`);prep(t)
}
function vInv(){
  const L=[...T].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0),lun=t=>status(t)==='Lunas',nb=L.filter(t=>['Belum bayar','Sebagian'].includes(status(t))&&(!icust||t.customer_id===icust)),sisa=nb.reduce((a,t)=>a+t.total-paid(t),0),
  F=itab==='semua'?L:itab==='lunas'?L.filter(lun):nb;
  $('#c').innerHTML=`<h2>Invoice</h2><div class="chips">${[['belum','Belum lunas ('+nb.length+')'],['lunas','Lunas ('+L.filter(lun).length+')'],['semua','Semua ('+L.length+')']].map(([k,l])=>`<button class="chip ${itab===k?'on':''}" onclick="itab='${k}';vInv()">${l}</button>`).join('')}</div>`
  +(itab==='belum'?`<select onchange="icust=this.value;vInv()"><option value="">Semua pelanggan</option>${C.map(c=>`<option value="${c.id}" ${icust===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:'')+(itab==='belum'&&nb.length?`<div class="card row sp"><span class="mut">Total piutang</span><b style="color:var(--rd)">${rp(sisa)}</b></div>`:'')
  +(F.length?F.map(t=>{const c=C.find(x=>x.id===t.customer_id),s=status(t);return `<div class="card row sp" onclick="invSheet('${t.id}')"><div><b>${t.no}</b><div class="mut">${esc(c?c.name:'Umum')} · ${fd(t.date)}</div></div><div style="text-align:right"><b>${rp(t.total)}</b><div><span class="pill ${s==='Lunas'?'':s==='Sebagian'?'o':'r'}">${s}</span></div></div></div>`}).join(''):'<p class="mut">Tidak ada invoice di tab ini.</p>')}

/* PRODUK */
function vProduk(){
  $('#c').innerHTML=`<div class="row sp"><h2>Produk</h2><button class="pri" onclick="pForm()">+ Tambah</button></div><input id="q" placeholder="🔍 Cari" value="${esc(q)}"><div id="pl"></div>`;
  const d=()=>{$('#pl').innerHTML=P.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(p=>`<div class="card row sp" onclick="pForm('${p.id}')"><div><b>${esc(p.name)}</b> ${p.active?'':'<span class="pill r">nonaktif</span>'}<div class="mut">${esc(p.category)} · HPP ${rp(p.cost)}${p.track?' · stok '+p.stock+' '+esc(p.unit):''}</div></div><div style="text-align:right"><b>${rp(p.price)}</b><div class="mut">✏️ Ubah</div></div></div>`).join('')};
  $('#q').oninput=e=>{q=e.target.value;d()};d()
}
function pForm(id){
  const p=P.find(x=>x.id===id)||{name:'',category:cat==='Semua'?'Frozen Food':cat,cost:'',price:'',stock:0,unit:'pcs',track:true,active:true};
  sheet(`<h2>${id?'Ubah':'Tambah'} produk</h2><input id="a" placeholder="Nama produk" value="${esc(p.name)}"><select id="b">${CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select>
  <div class="row"><input id="c1" type="number" inputmode="numeric" placeholder="HPP Rp" value="${p.cost}"><input id="d" type="number" inputmode="numeric" placeholder="Harga jual Rp" value="${p.price}"></div>
  <div class="row"><input id="e" type="number" inputmode="decimal" placeholder="Stok" value="${p.stock}"><input id="u" placeholder="Satuan" value="${esc(p.unit)}"></div>
  <label class="row"><input type="checkbox" id="tr" style="width:auto;margin:0" ${p.track?'checked':''}> Lacak stok</label><label class="row" style="margin:8px 0"><input type="checkbox" id="ac" style="width:auto;margin:0" ${p.active?'checked':''}> Aktif (tampil di kasir)</label>

async function exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['No','Tanggal','Pelanggan','Produk','Qty','Harga','Subtotal','Status','Dibayar']];
  T.filter(t=>!t.void).forEach(t=>{const c=C.find(x=>x.id===t.customer_id);t.items.forEach(i=>rows.push([t.no,fd(t.date),c?c.name:'Umum',i.name,i.qty,i.price,i.qty*i.price,status(t),paid(t)]))});
  const f=new File(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],'transaksi-nyemiljajan.csv',{type:'text/csv'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){}}
function vStok(){const tp=P.filter(p=>p.track&&p.active);
  $('#c').innerHTML=`<h2>Stok</h2><div class="card"><select id="sp">${tp.map(p=>`<option value="${p.id}">${esc(p.name)} (stok ${p.stock})</option>`).join('')}</select><select id="st"><option value="in">Stok masuk (+)</option><option value="out">Stok keluar (−)</option><option value="adj">Penyesuaian (set jumlah)</option></select><input id="sq" type="number" inputmode="decimal" placeholder="Jumlah"><input id="sn" placeholder="Catatan (opsional)"><button class="pri" style="width:100%" onclick="stokApply()">Simpan</button></div><div class="card"><b>Riwayat stok</b>`+[...M].sort((a,b)=>b.date<a.date?-1:1).slice(0,40).map(m=>{const p=P.find(x=>x.id===m.product_id);return `<div class="line row sp"><span>${esc(p?p.name:'?')}<div class="mut">${fd(m.date)} · ${esc(m.note||'')}</div></span><b>${m.qty>0?'+':''}${m.qty}</b></div>`}).join('')+`</div>`}
async function stokApply(){const p=P.find(x=>x.id===$('#sp').value),ty=$('#st').value,q=parseFloat($('#sq').value);if(!p||!(q>=0)||(ty!=='adj'&&!(q>0)))return toast('Isi jumlah dengan benar');
  const d=ty==='in'?q:ty==='out'?-q:q-p.stock;if(p.stock+d<0)return toast('Stok tidak boleh minus');if(!d)return toast('Tidak ada perubahan');
  p.stock+=d;p.updated_at=Date.now();await save([['products',p],mv(p.id,d,$('#sn').value.trim()||{in:'Stok masuk',out:'Stok keluar',adj:'Penyesuaian'}[ty])]);toast('Stok diperbarui');vStok()}
let RS={id:'',name:'',yield:10,pack:0,margin:40,rows:[{n:'',p:0,q:1,u:0}]};
function rcalc(){const b=RS.rows.reduce((a,r)=>a+(r.q>0?r.p/r.q*r.u:0),0),hpp=b/(RS.yield>0?RS.yield:1)+(+RS.pack||0),rc=Math.ceil(hpp*(1+(+RS.margin||0)/100)/500)*500;return{b,hpp,rc,laba:rc-hpp}}
function rshow(){const r=rcalc();$('#rr').innerHTML=`<div class="row sp"><span>Total bahan</span><b>${rp(r.b)}</b></div><div class="row sp"><span>HPP per pcs</span><b>${rp(r.hpp)}</b></div><div class="row sp"><span>Harga jual rekomendasi</span><b style="color:var(--prd)">${rp(r.rc)}</b></div><div class="row sp"><span>Laba per pcs</span><b>${rp(r.laba)}</b></div>`}
function rs(i,k,v){RS.rows[i][k]=v;rshow()}
function loadR(id){const r=RC.find(x=>x.id===id);if(r){RS=JSON.parse(JSON.stringify(r));vResep()}}
function vResep(){const rows=RS.rows.map((r,i)=>`<div class="card"><input placeholder="Nama bahan" value="${esc(r.n)}" oninput="rs(${i},'n',this.value)"><div class="row"><input type="number" inputmode="decimal" placeholder="Harga beli Rp" value="${r.p||''}" oninput="rs(${i},'p',+this.value)"><input type="number" inputmode="decimal" placeholder="Isi beli (g/ml/pcs)" value="${r.q||''}" oninput="rs(${i},'q',+this.value)"></div><div class="row"><input type="number" inputmode="decimal" placeholder="Jumlah dipakai" value="${r.u||''}" oninput="rs(${i},'u',+this.value)"><button class="dng" onclick="RS.rows.splice(${i},1);vResep()">✕</button></div></div>`).join('');
  $('#c').innerHTML=`<h2>Resep & HPP</h2>`+(RC.length?`<select onchange="loadR(this.value)"><option value="">Muat resep tersimpan…</option>${RC.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>`:'')+`<input placeholder="Nama resep / produk" value="${esc(RS.name)}" oninput="RS.name=this.value">${rows}<button style="width:100%;margin-bottom:8px" onclick="RS.rows.push({n:'',p:0,q:1,u:0});vResep()">+ Tambah bahan</button><div class="row"><input type="number" inputmode="decimal" placeholder="Hasil (pcs)" value="${RS.yield}" oninput="RS.yield=+this.value;rshow()"><input type="number" inputmode="numeric" placeholder="Kemasan/pcs Rp" value="${RS.pack||''}" oninput="RS.pack=+this.value;rshow()"><input type="number" inputmode="numeric" placeholder="Margin %" value="${RS.margin}" oninput="RS.margin=+this.value;rshow()"></div><div class="card" id="rr"></div><div class="row"><button class="f1" onclick="saveR()">Simpan resep</button><button class="pri f1" onclick="toProd()">Jadikan produk</button></div>`;rshow()}
async function saveR(){if(!RS.name.trim())return toast('Isi nama resep');let r=RC.find(x=>x.id===RS.id);if(!r){r=rec({});RC.push(r);RS.id=r.id}Object.assign(r,JSON.parse(JSON.stringify(RS)),{id:r.id,updated_at:Date.now()});await save([['recipes',r]]);toast('Resep tersimpan');vResep()}
async function toProd(){const n=RS.name.trim(),r=rcalc();if(!n||!(RS.yield>0))return toast('Isi nama dan hasil produksi');if(!confirm('Buat produk "'+n+'" dengan HPP '+rp(r.hpp)+', harga '+rp(r.rc)+', stok awal '+RS.yield+'?'))return;
  const p=rec({sku:'',name:n,category:'Frozen Food',cost:Math.round(r.hpp),price:r.rc,stock:RS.yield,unit:'pcs',track:true,active:true});P.push(p);await save([['products',p],mv(p.id,RS.yield,'Hasil produksi')]);toast('Produk dibuat, ubah kategori/harga di menu Produk')}

init();
</script>
